plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autolauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.autolauncher'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'armeabi-v7a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
